name: jinsei_bio_redesign
description: "Jinsei Bio Redesign — Premium Multi-Platform Flutter App (Web + Android + iOS)"
publish_to: 'none'
version: 1.2.2+14

resolution: workspace

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Serverpod Auto-Generated Client SDK
  jinsei_bio_redesign_client:
    path: ../jinsei_bio_redesign_client
  serverpod_flutter: ^1.2.0

  # State Management (ADR-005)
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Routing
  go_router: ^13.1.0

  # Storage & Persistence
  shared_preferences: ^2.2.2

  # UI & Design Tokens (DESIGN.md)
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  url_launcher: ^6.2.4
  # Native Splash Screen
  flutter_native_splash: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^9.1.5
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/images/logo/official_brand_logo.png"
    background_color: "#121414"
    theme_color: "#7BD4E2"
  image_path: "assets/images/logo/official_brand_logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#121414"
  image: "assets/images/logo/official_brand_logo.png"
  color_dark: "#121414"
  image_dark: "assets/images/logo/official_brand_logo.png"
  android_12:
    image: "assets/images/logo/official_brand_logo.png"
    color: "#121414"
    icon_background_color: "#121414"
  web: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo/
    - assets/images/science/
    - assets/config/
    - assets/data/


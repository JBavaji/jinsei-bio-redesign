name: jinsei_bio_redesign
description: "Jinsei Bio Redesign — Premium Multi-Platform Flutter App (Web + Android + iOS)"
publish_to: 'none'
version: 1.0.0+1

resolution: workspace

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Serverpod Auto-Generated Client SDK
  jinsei_bio_redesign_client:
    path: ../jinsei_bio_redesign_client
  serverpod_flutter: ^1.2.0

  # State Management (ADR-005)
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Routing
  go_router: ^13.1.0

  # UI & Design Tokens (DESIGN.md)
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^9.1.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo/

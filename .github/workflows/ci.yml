name: Jinsei Bio Multi-Platform Monorepo CI

on:
  push:
    branches: [ main, staging, develop, 'feat/**', 'develop/**' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/images/**'
      - '.gitignore'
  pull_request:
    branches: [ main, staging, develop, 'feat/**', 'develop/**' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/images/**'
      - '.gitignore'

# Cancel outdated in-progress runs when a new push occurs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Ubuntu Job: Format, Static Analysis, Unit/Widget Tests, Web & Android Build
  # ---------------------------------------------------------------------------
  analyze_test_and_build_ubuntu:
    name: "Ubuntu: Monorepo Analyze, Test, Web & Android Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK (for Android build)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Display Flutter & Dart Info
        run: |
          flutter --version
          dart --version

      - name: Install Monorepo Dependencies
        run: |
          cd jinsei_bio_redesign_client && flutter pub get
          cd ../jinsei_bio_redesign_server && dart pub get
          cd ../jinsei_bio_redesign_flutter && flutter pub get

      - name: Check Formatting (dart format)
        run: |
          cd jinsei_bio_redesign_flutter && dart format --output=none --set-exit-if-changed .

      - name: Run Static Analysis (dart analyze)
        run: |
          cd jinsei_bio_redesign_flutter && flutter analyze --no-fatal-infos

      - name: Run Automated Tests & Coverage
        run: |
          if [ -d "jinsei_bio_redesign_flutter/test" ]; then
            cd jinsei_bio_redesign_flutter && flutter test --coverage
          fi

      - name: Verify Flutter Web Build
        run: |
          cd jinsei_bio_redesign_flutter && flutter build web --release --dart-define=APP_MODE=UNOFFICIAL_DEMO

      - name: Verify Flutter Android APK Build
        run: |
          cd jinsei_bio_redesign_flutter && flutter build apk --debug --dart-define=APP_MODE=UNOFFICIAL_DEMO

  # ---------------------------------------------------------------------------
  # 2. macOS Job: Flutter iOS Build Verification (Restricted to Staging/Main & Manual PR Label)
  # ---------------------------------------------------------------------------
  build_ios_macos:
    name: "macOS: iOS Build Verification (10x Multiplier Gate)"
    runs-on: macos-latest
    needs: analyze_test_and_build_ubuntu
    if: |
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'staging')) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')) ||
      contains(github.event.pull_request.labels.*.name, 'run-ios-ci')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd jinsei_bio_redesign_client && flutter pub get
          cd ../jinsei_bio_redesign_flutter && flutter pub get

      - name: Verify Flutter iOS Build (No-codesign)
        run: |
          cd jinsei_bio_redesign_flutter && flutter build ios --debug --no-codesign --dart-define=APP_MODE=UNOFFICIAL_DEMO

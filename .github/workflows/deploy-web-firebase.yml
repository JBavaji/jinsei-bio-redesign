name: Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches:
      - main
      - staging
      - develop

jobs:
  build_and_deploy:
    name: Build & Deploy Flutter Web
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔍 Install Dependencies & Run Quality Gates
        run: |
          cd jinsei_bio_redesign_flutter
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: 🏗️ Build Web Release Bundle
        run: |
          cd jinsei_bio_redesign_flutter
          flutter build web --release --dart-define=APP_MODE=UNOFFICIAL_DEMO

      - name: 🧪 Deploy to Firebase Hosting (Beta Testing Release — staging branch)
        if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JINSEI_BIO_REDESIGN }}'
          channelId: 'staging'
          projectId: jinsei-bio-redesign

      - name: 🚀 Deploy to Firebase Hosting (Production Release — main branch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JINSEI_BIO_REDESIGN }}'
          channelId: live
          projectId: jinsei-bio-redesign
